# Compila el Boletín Institucional para Windows, macOS y Linux en los servidores de GitHub.
#
# Cuándo se ejecuta:
#   • Manualmente: pestaña Actions → «Compilar ejecutables» → Run workflow.
#   • Al publicar una versión con una etiqueta v… (p. ej. v1.0.0): además crea un «Release»
#     con los tres archivos listos para descargar.
name: Compilar ejecutables

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compilar:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Windows
            paquete: Boletin_Institucional_Windows.zip
          - os: macos-latest          # Mac con chip Apple (M1, M2, M3, M4)
            nombre: macOS-Apple
            paquete: Boletin_Institucional_macOS_Apple.zip
          - os: macos-15-intel        # Mac con procesador Intel
            nombre: macOS-Intel
            paquete: Boletin_Institucional_macOS_Intel.zip
          - os: ubuntu-22.04
            nombre: Linux
            paquete: Boletin_Institucional_Linux.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-compilar.txt

      - name: Librerías del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libasound2 libgbm1 fonts-liberation

      - name: Compilar
        run: pyinstaller --noconfirm --clean empaquetado/boletin.spec

      - name: Probar exportación a PDF con el ejecutable
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXE="dist/Boletín Institucional.app/Contents/MacOS/BoletinInstitucional"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/BoletinInstitucional/BoletinInstitucional.exe"
          else
            EXE="dist/BoletinInstitucional/BoletinInstitucional"
          fi
          "$EXE" ejemplos/ejemplo.boletin --pdf prueba.pdf || true
          test -s prueba.pdf && echo "PDF de prueba generado correctamente" || echo "::warning::No se generó el PDF de prueba"

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/BoletinInstitucional -DestinationPath ${{ matrix.paquete }}

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Boletín Institucional.app" ${{ matrix.paquete }}

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.paquete }} -C dist BoletinInstitucional

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.paquete }}
          retention-days: 30

  publicar:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: paquetes/*
          generate_release_notes: true
